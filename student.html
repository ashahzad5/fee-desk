<title>Fee call – Blackstone School of Law &amp; Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0C1D3B; --gold: #D8B76A; --gold-pale: #F1E6C8;
    --violet: #7B5CFF; --coral: #FF5D73; --mint: #1FBF97;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(120% 70% at 50% 110%, rgba(123,92,255,.45), transparent 60%), var(--navy);
    color: #fff;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px 32px;
    text-align: center;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; flex: 1; }
  .logo { width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 0 0 3px var(--gold), 0 0 0 8px rgba(216,183,106,.18); }
  .school { margin: 14px 0 0; font-size: .9rem; color: var(--gold-pale); }
  h1 { margin: 22px 0 6px; font-size: clamp(1.7rem, 7vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .lead { margin: 0; color: #C9D0E8; max-width: 34ch; }
  .fee-card {
    margin-top: 20px; width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px;
    padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    text-align: left;
  }
  .fee-card span { display: block; font-size: .82rem; color: #C9D0E8; }
  .fee-card strong { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fee-card .id { text-align: right; }

  .talk {
    margin: 34px 0 10px;
    position: relative;
    width: 190px; height: 190px;
    border: 0; padding: 0; border-radius: 50%;
    background: none;
    color: #fff;
    display: grid; place-items: center;
  }
  .talk .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px dashed rgba(216,183,106,.5); }
  .talk .orb {
    position: absolute; inset: 18px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--violet), var(--coral), var(--gold), var(--violet));
    box-shadow: 0 18px 50px -12px rgba(123,92,255,.8);
    transition: transform .12s linear;
  }
  .talk .orb::after {
    content: ""; position: absolute; inset: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), rgba(12,29,59,.2) 60%, var(--navy) 100%);
    mix-blend-mode: soft-light;
  }
  .talk .label { position: relative; font-weight: 800; font-size: 1.35rem; text-shadow: 0 2px 10px rgba(12,29,59,.6); }
  .talk:disabled { cursor: default; color: #fff; }
  .talk:disabled .orb { filter: saturate(.6) brightness(.85); }
  body[data-state="connecting"] .talk .orb { animation: spin 1.6s linear infinite; }
  body[data-state="live"] .talk .ring { animation: spin 14s linear infinite; }
  body[data-state="ended"] .talk .orb { filter: saturate(.4) brightness(.7); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state { min-height: 1.5em; color: var(--gold-pale); font-weight: 600; font-variant-numeric: tabular-nums; }
  .end {
    margin-top: 14px;
    border: 0; border-radius: 999px;
    background: var(--coral); color: #fff;
    padding: 12px 28px; font-weight: 700;
  }
  .end[hidden] { display: none; }
  .note { margin-top: auto; padding-top: 28px; font-size: .82rem; color: #9AA3C4; max-width: 36ch; }
  .error {
    margin-top: 16px; padding: 12px 16px; border-radius: 14px;
    background: rgba(255,93,115,.14); border: 1px solid rgba(255,93,115,.5);
    color: #FFD3DA; font-size: .92rem;
  }
  .error[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

    <p class="school">Blackstone School of Law &amp; Business</p>

    <h1 id="greet">Loading your details…</h1>
    <p class="lead" id="lead">One moment.</p>

    <div class="fee-card" id="feeCard" hidden>
      <div><span>Outstanding fee</span><strong id="fee"></strong></div>
      <div class="id"><span>Student ID</span><strong id="sid" style="font-size:1rem"></strong></div>
    </div>

    <button class="talk" id="talk" disabled aria-label="Start talking with the fee assistant">
      <span class="ring"></span><span class="orb" id="orb"></span><span class="label" id="talkLabel">Talk</span>
    </button>
    <div class="state" id="state" aria-live="polite"></div>
    <button class="end" id="endBtn" hidden>End call</button>
    <div class="error" id="error" role="alert" hidden></div>

    <p class="note">You’ll be speaking with the school’s automated fee assistant. Your phone will ask to use the microphone; tap Allow.</p>
  </div>

<script type="module">
  // ===== Settings: same values as in index.html =====
  const VAPI_PUBLIC_KEY = "da0bcf4e-de68-4561-91a2-b2a9af3a2049";
  const ASSISTANT_ID    = "8b9b1126-c31a-4215-a955-595c625f3c20";
  const API_URL         = "https://script.google.com/macros/s/AKfycbztFaKa60I8CLNEeQciopaKd47kECf-cE9MpCpD35u5EeRFPIXW3St3ygUh9Xg22-EH7w/exec";   // your web app link ending in /exec
  // ===================================================
  const LIVE = API_URL.startsWith("https://");
  async function api(params) {
    const res = await fetch(API_URL + "?" + new URLSearchParams(params));
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Request failed");
    return json.data;
  }


  const $ = id => document.getElementById(id);
  const toNum = v => Number(String(v).replace(/[^\d.]/g, "")) || 0;
  let student = null, token = "", vapi = null, timerId = null, started = null, talked = false;

  function showError(msg) { $("error").textContent = msg; $("error").hidden = false; }

  const SDK_URLS = [
    "https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.3.10/+esm",
    "https://esm.sh/@vapi-ai/web@2.3.10"
  ];
  (async () => {
    let lastErr;
    for (const url of SDK_URLS) {
      try {
        const mod = await import(url);
        const Vapi = (mod.default && mod.default.default) || mod.default;
        vapi = new Vapi(VAPI_PUBLIC_KEY);
        wire();
        ready();
        return;
      } catch (e) { lastErr = e; console.error(url, e); }
    }
    showError("The call service didn't load. Open this link in Chrome or Safari and try again. (" + ((lastErr && lastErr.message) || lastErr) + ")");
  })();

  function ready() {
    if (student && vapi) { $("talk").disabled = false; document.body.dataset.state = "ready"; $("state").textContent = "Tap Talk to start"; }
  }

  function showStudent(s) {
    student = s;
    $("greet").textContent = `Assalam o Alaikum, ${s.name}`;
    $("lead").textContent = "The fee desk would like a quick word about your fee. Tap Talk and our assistant will speak with you.";
    $("fee").textContent = "PKR " + toNum(s.fee).toLocaleString("en-PK");
    $("sid").textContent = s.id;
    $("feeCard").hidden = false;
    ready();
  }

  $("talk").addEventListener("click", () => {
    if (!vapi || !student || document.body.dataset.state === "live" || document.body.dataset.state === "connecting") return;
    $("error").hidden = true;
    document.body.dataset.state = "connecting";
    $("talkLabel").textContent = "…";
    $("state").textContent = "Connecting…";
    vapi.start(ASSISTANT_ID, {
      variableValues: { name: student.name, studentId: student.id, year: student.year, fee: toNum(student.fee).toLocaleString("en-PK") }
    }).then(call => {
      if (call && call.id && LIVE) api({ api: "register", t: token, callId: call.id }).catch(console.error);
    }).catch(console.error);
  });
  $("endBtn").addEventListener("click", () => vapi && vapi.stop());

  function wire() {
    vapi.on("call-start", () => {
      talked = true;
      document.body.dataset.state = "live";
      $("talkLabel").textContent = "Live";
      $("endBtn").hidden = false;
      started = Date.now();
      timerId = setInterval(() => {
        const s = Math.floor((Date.now() - started) / 1000);
        $("state").textContent = `On call, ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }, 1000);
    });
    vapi.on("volume-level", v => { $("orb").style.transform = `scale(${1 + Math.min(v, 1) * 0.2})`; });
    vapi.on("call-end", () => {
      clearInterval(timerId);
      $("orb").style.transform = "";
      $("endBtn").hidden = true;
      document.body.dataset.state = "ended";
      $("talkLabel").textContent = "Talk";
      $("talk").disabled = false;
      $("state").textContent = "Thank you. The fee desk has your call. Tap Talk if you need to speak again.";
      if (talked && LIVE) api({ api: "talked", t: token }).catch(console.error);
      setTimeout(() => { if (document.body.dataset.state === "ended") document.body.dataset.state = "ready"; }, 400);
    });
    vapi.on("error", e => {
      console.error(e);
      clearInterval(timerId);
      let detail = "";
      try { detail = typeof e === "string" ? e : JSON.stringify(e?.error ?? e); } catch (_) { detail = String(e); }
      detail = String(detail).slice(0, 300);
      const msg = String(e?.error?.message || e?.message || "") + " " + detail;
      document.body.dataset.state = "ready";
      $("talkLabel").textContent = "Talk";
      $("endBtn").hidden = true;
      $("state").textContent = "";
      showError(/permission|notallowed|microphone/i.test(msg)
        ? "Your microphone is blocked. Allow microphone access for this page in your browser settings, then tap Talk again."
        : "The call couldn't connect. Tap Talk again, and if it keeps failing send this to the fee desk: " + detail);
    });
  }

  token = new URLSearchParams(location.search).get("t") || "";
  if (LIVE) {
    api({ api: "student", t: token })
      .then(showStudent)
      .catch(() => {
        $("greet").textContent = "This link isn't valid";
        $("lead").textContent = "Ask the Blackstone fee desk to send you a new link.";
      });
  } else {
    $("greet").textContent = "This page isn't set up yet";
    $("lead").textContent = "Please contact the Blackstone fee desk.";
  }
</script>
